<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/js/consent.js?v=20261123a" defer></script>
  <title>Page not found | American Visa Guide</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/main.css?v=20261024c">
  <link rel="stylesheet" href="/css/components.css?v=20261024c">
  <style>
    .nf-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 6rem 1.5rem 4rem;
      text-align: center;
    }
    .nf-eyebrow {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-mark, #991B1B);
      margin-bottom: var(--space-3);
    }
    .nf-title {
      font-family: var(--font-display);
      font-size: var(--text-4xl);
      color: var(--color-text);
      line-height: var(--leading-tight);
      margin-bottom: var(--space-4);
    }
    .nf-title em {
      font-style: italic;
      font-weight: var(--font-medium);
      color: var(--color-mark, #991B1B);
    }
    .nf-lead {
      font-size: var(--text-base);
      color: var(--color-text-secondary);
      line-height: var(--leading-relaxed);
      margin-bottom: var(--space-8);
    }
    .nf-actions {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
      flex-wrap: wrap;
    }
    .nf-tried { margin: calc(-1 * var(--space-4, 1rem)) 0 var(--space-6, 1.5rem); font-size: var(--text-sm); color: var(--color-text-secondary); overflow-wrap: anywhere; }
    .nf-tried code { font-size: inherit; background: #f1f5f9; padding: 0.1rem 0.35rem; border-radius: 4px; }
    .nf-search { margin: 0 0 var(--space-6, 1.5rem); }
    .nf-search__label { display: block; font-weight: 600; margin-bottom: 0.4rem; }
    .nf-search__row { display: flex; gap: 0.5rem; max-width: 34rem; }
    .nf-search__row input {
      flex: 1; min-width: 0; min-height: 44px; padding: 0 0.85rem;
      border: 1px solid #94a3b8; border-radius: 6px; font: inherit; background: #fff; color: #0f172a;
    }
    .nf-search__row input:focus { outline: 3px solid #0f172a; outline-offset: 2px; }
  </style>
  <link rel="stylesheet" href="/css/nav.css?v=20261115b">
  <script src="/js/nav.js?v=20261115d8" defer></script>
<link rel="stylesheet" href="/css/readability.css?v=20261024c">
</head>
<body>

  <div id="nav-placeholder"></div>

  <main id="main-content">
    <div class="nf-wrap">
      <div class="nf-eyebrow">404: page not found</div>
      <h1 class="nf-title">This page joined the <em>wrong queue</em></h1>
      <p class="nf-lead">The page you're looking for doesn't exist or has moved. Search for it, or start from one of these.</p>
      <p class="nf-tried" id="nf-tried" hidden>You tried: <code id="nf-tried-path"></code></p>
      <form class="nf-search" action="/search" method="get" role="search">
        <label for="nf-q" class="nf-search__label">Search the site</label>
        <div class="nf-search__row">
          <input id="nf-q" name="q" type="search" autocomplete="off" placeholder="e.g. joint sponsor or 221(g)">
          <button type="submit" class="btn btn--primary">Search</button>
        </div>
      </form>
      <div class="nf-actions">
        <a href="/guide" class="btn btn--secondary">Guide</a>
        <a href="/interview" class="btn btn--secondary">Interview</a>
        <a href="/tools" class="btn btn--secondary">Tools</a>
        <a href="/data" class="btn btn--secondary">Data</a>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script>
    /* The homepage sends missing addresses here as /404?from=<address>
       (see the workaround in index.html). Show what was tried, and offer
       its words as a search. */
    (function () {
      var from = new URLSearchParams(location.search).get('from');
      if (!from || from.charAt(0) !== '/') return;
      document.getElementById('nf-tried-path').textContent = from;
      document.getElementById('nf-tried').hidden = false;
      var last = from.split('?')[0].replace(/\/+$/, '').split('/').pop() || '';
      var words = last.replace(/\.html?$/, '').replace(/[-_.+]+/g, ' ').trim();
      if (words) document.getElementById('nf-q').value = words;
    })();
  </script>

</body>
</html>
